<script>
    let menu = document.getElementById('menu');
    if (menu) {
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });
</script>
<script>
    var toplink = document.getElementById("top-link");
    window.onscroll = function () {
        const scrollThreshold = window.innerHeight;
        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };
</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })
</script>


<script>
function initCodeFold() {
    const highlights = document.querySelectorAll(".post-content .highlight");

    highlights.forEach((box, index) => {
        
        if (box.querySelector(".code-fold-btn")) return;

        const foldBtn = document.createElement("button");
        foldBtn.className = "code-fold-btn";
        foldBtn.innerText = "折叠";
        foldBtn.setAttribute("aria-label", "折叠代码块");
        foldBtn.setAttribute("data-index", index);

        box.style.position = "relative";
        box.appendChild(foldBtn);

        foldBtn.addEventListener("click", function(e) {
            e.preventDefault();
            e.stopPropagation();
            box.classList.toggle("collapsed");
            foldBtn.innerText = box.classList.contains("collapsed") ? "展开" : "折叠";
        });
    });
}


window.addEventListener("DOMContentLoaded", initCodeFold);
window.addEventListener("load", initCodeFold);
setTimeout(initCodeFold, 800);
</script>
<script>
(function() {
  var curtain = document.getElementById('curtain');
  if (!curtain) return;

  
  function openCurtain() {
    curtain.offsetHeight;
    requestAnimationFrame(function() {
      curtain.classList.add('curtain-open');
    });
  }
  
  if (document.readyState === 'complete') {
    openCurtain();
  } else {
    window.addEventListener('load', openCurtain);
    
    setTimeout(openCurtain, 3000);
  }

  
  document.addEventListener('click', function(e) {
    var link = e.target.closest('a');
    if (!link) return;
    
    if (link.hostname !== location.hostname) return;
    if (link.target === '_blank') return;
    if (link.hasAttribute('download')) return;
    
    var href = link.getAttribute('href');
    if (!href || href === '#' || href.startsWith('#')) return;
    
    if (href.includes('livereload')) return;

    e.preventDefault();
    curtain.classList.remove('curtain-open');
    curtain.classList.add('curtain-close');

    setTimeout(function() {
      location.href = href;
    }, 400);
  });
})();
</script>
