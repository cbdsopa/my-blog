backend:
  name: github
  repo: cbdsopa/my-blog
  branch: main
  base_url: https://api.decapcms.org
  auth_endpoint: auth

media_folder: static/images
public_folder: /my-blog/images

collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "toml-frontmatter"
    extension: "md"
    editor:
      preview: false
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ"}
      - {label: "草稿", name: "draft", widget: "boolean", default: false}
      - {label: "分类", name: "categories", widget: "list"}
      - {label: "标签", name: "tags", widget: "list"}
      - {label: "正文", name: "body", widget: "markdown"}
