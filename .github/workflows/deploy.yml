name: Deploy

on:
  push:
    branches: ["main"] # 当 main 分支有代码推送时触发
  workflow_dispatch:

# 设置权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 【关键】自动拉取 PaperMod 主题源码
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true         # 启用 Hugo 扩展版

      - name: Build with Hugo
        run: hugo --minify       # 编译压缩 HTML/CSS/JS

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public         # 将生成的 public 目录作为产物上传

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4