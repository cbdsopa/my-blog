baseURL = "https://cbdsopa.github.io/my-blog/"
locale = 'en-us'
title = "cbdsopa's blog"
theme = "PaperMod"
[params]
  comments = true
  ShowCodeCopyButtons = true
  ShowToc = true
  mainSections = ["posts"]

[params.profileMode]
  enabled = true
  title = "cbdsopa"
  subtitle = "星の数の言葉の中から，ひとつ何かを探してる"
  imageUrl = "https://github.com/cbdsopa.png"
  imageTitle = "avatar"
  imageWidth = 120
  imageHeight = 120

  [[params.profileMode.buttons]]
    name = "文章"
    url = "/my-blog/posts/"

  [[params.profileMode.buttons]]
    name = "分类"
    url = "/my-blog/categories/"

  [[params.profileMode.buttons]]
    name = "标签"
    url = "/my-blog/tags/"

[[params.socialIcons]]
    name = "github"
    url = "https://github.com/cbdsopa"

[menu]
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 5

  [[menu.main]]
    name = "分类"
    url = "/categories/"
    weight = 10

  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 20

  [[menu.main]]
    name = "搜索"
    url = "/search/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    style = "monokai"
    lineNos = false
    noClasses = false

